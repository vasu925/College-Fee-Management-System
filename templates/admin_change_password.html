{% extends "base.html" %}
{% block title %}Change Password | Campus Finance{% endblock %}
{% block page_heading %}Account security{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">ADMIN ACCOUNT</div><h1>Change password</h1><p>Update your administrator password securely.</p></div></div>
<section class="panel" style="max-width:560px">
  <form method="post" action="{{ url_for('admin_change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <label class="field full"><span>Current password</span><input type="password" name="current_password" autocomplete="current-password" required></label>
      <label class="field full"><span>New password</span><input type="password" name="new_password" minlength="12" autocomplete="new-password" required><small>Use at least 12 characters.</small></label>
      <label class="field full"><span>Confirm new password</span><input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required></label>
    </div>
    <div style="margin-top:20px"><button class="button primary" type="submit">Update password</button></div>
  </form>
</section>
{% endblock %}
